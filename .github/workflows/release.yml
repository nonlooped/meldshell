name: Release
run-name: Release (${{ inputs.channel || (github.event.schedule == '17 0 * * *' && 'stable' || 'nightly') }})

# Releases are cut by this workflow from main. Daily, a stable release publishes the
# CHANGELOG.md Unreleased entries as the next minor version when there are any. Hourly, a nightly
# prerelease publishes main when app files changed since the last release. Either one is cut only
# after the full CI suite and packaging pass on that commit, and a commit whose release failed is
# not retried by the schedule; a new commit or a manual run retries. A manual run can also release
# now (including a forced nightly), or build installers from any ref as workflow artifacts.
on:
  schedule:
    - cron: '17 0 * * *' # stable
    - cron: '47 * * * *' # nightly
  workflow_dispatch:
    inputs:
      channel:
        description: Release to cut
        type: choice
        options: [nightly, stable, build-only]
        default: build-only
      force_nightly:
        description: Cut a nightly even when no app files changed
        type: boolean
        default: false

permissions:
  contents: read

# Releases run one at a time so a nightly never tags beside a stable cut in progress.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CHANNEL: ${{ inputs.channel || (github.event.schedule == '17 0 * * *' && 'stable' || 'nightly') }}
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TITLE: Release (${{ env.CHANNEL }})
          FORCE_NIGHTLY: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'nightly' && inputs.force_nightly }}
        run: |
          if [ "$CHANNEL" = build-only ]; then
            version=$(node -p 'require("./package.json").version')
            printf 'build=true\nrelease=false\nversion=%s\n' "$version" >> "$GITHUB_OUTPUT"
            echo "Building $version installers without releasing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are cut only from main"
            exit 1
          fi
          force_args=()
          if [ "$FORCE_NIGHTLY" = true ]; then force_args=(--force); fi
          node scripts/release.mjs plan "$CHANNEL" "${force_args[@]}" > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan"
          release=$(sed -n 's/^release=//p' "$RUNNER_TEMP/plan")
          reason=$(sed -n 's/^reason=//p' "$RUNNER_TEMP/plan")
          if [ "$release" = true ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            failed=$(gh run list --workflow release.yml --commit "$GITHUB_SHA" --status failure \
              --json displayTitle --jq "map(select(.displayTitle == \"$RUN_TITLE\")) | length")
            if [ "$failed" != 0 ]; then
              release=false
              reason="a $CHANNEL release of $GITHUB_SHA already failed; waiting for a new commit"
            fi
          fi
          grep -Ev '^(release|reason)=' "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"
          printf 'release=%s\nbuild=%s\n' "$release" "$release" >> "$GITHUB_OUTPUT"
          echo "${CHANNEL^}: $reason" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      # electron-builder downloads Electron itself, and the Node-API addons need no Electron rebuild.
      - run: npm ci --ignore-scripts
      # node-pty ships prebuilds for Windows and macOS only.
      - name: Build the Linux terminal addon
        if: matrix.platform == 'linux'
        run: npm rebuild node-pty
      - name: Set the release version
        if: needs.plan.outputs.publish == 'true'
        shell: bash
        run: node scripts/release.mjs set-version "$VERSION"
      - name: Cache packaging tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/desktop/electron-builder.yml') }}
          restore-keys: electron-builder-${{ runner.os }}-
      - run: npm run build
      - name: Package without publishing
        working-directory: apps/desktop
        run: npx --no-install electron-builder --${{ matrix.platform }} --x64 --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.platform }}-${{ env.VERSION }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [plan, checks, package]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          merge-multiple: true
          path: release
      - name: Verify artifacts
        working-directory: release
        run: |
          for file in "MeldShell-$VERSION-setup.exe" "MeldShell-$VERSION-setup.exe.blockmap" \
            "MeldShell-$VERSION-x86_64.AppImage" latest.yml latest-linux.yml; do
            test -s "$file" || { echo "::error::Missing $file"; exit 1; }
          done
          grep -q "^version: $VERSION$" latest.yml
          grep -q "^version: $VERSION$" latest-linux.yml
          # The updater reads a prerelease's own channel file before falling back to latest.
          if [ "$PRERELEASE" = true ]; then
            cp latest.yml nightly.yml
            cp latest-linux.yml nightly-linux.yml
          fi
          sha256sum -- *.exe *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A rerun after a failed upload reuses the tag it already pushed.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          elif [ "$PRERELEASE" = true ]; then
            git tag --annotate "$TAG" --message "MeldShell $VERSION"
            git push origin "refs/tags/$TAG"
          else
            node scripts/release.mjs cut "$VERSION"
            # Fails without releasing if main moved since the checked commit; the next day retries.
            git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
          fi
      - name: Stage, upload, and publish release
        run: |
          if [ "$PRERELEASE" = true ]; then
            node scripts/release.mjs nightly-notes "$PREVIOUS" "$TAG" > "$RUNNER_TEMP/notes.md"
            title="MeldShell $VERSION (nightly)"
          else
            node scripts/release.mjs notes "$VERSION" "$TAG" > "$RUNNER_TEMP/notes.md"
            title="MeldShell $VERSION"
          fi
          # A rerun may replace assets only on a release that is still a draft.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then echo "::error::$TAG is already published"; exit 1; fi
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --draft --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          (cd release && gh release upload "$TAG" ./*.exe ./*.AppImage ./*.blockmap ./*.yml SHA256SUMS.txt --clobber)
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
          echo "Published release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
