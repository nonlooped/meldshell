appId: com.meldshell.desktop
productName: MeldShell
directories:
  buildResources: build
  output: ../../release
publish:
  provider: github
  owner: nonlooped
  repo: meldshell
files:
  - out/**
  - resources/icon.png
  - package.json
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!README.md"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  # Claude Code is discovered on the user's machine; never ship the SDK's native CLI.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  # SQLite's C sources only compile the addon; the package loads its bundled prebuilds.
  - "!node_modules/better-sqlite3/{deps,src}/**"
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  # Terminals: the native addon and, on Windows, the ConPTY helpers it launches as programs.
  - node_modules/node-pty/**
  - resources/**
win:
  executableName: MeldShell
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
linux:
  category: Development
  executableName: meldshell
  icon: build/icon.png
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  oneClick: false
  perMachine: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
# Every native dependency uses Node-API, so a binary built for Node also loads in Electron.
# better-sqlite3, msgpackr-extract, and node-pty on Windows load their bundled prebuilds;
# node-pty on Linux uses the addon that its install script compiles.
npmRebuild: false
